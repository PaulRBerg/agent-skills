name: CI

on:
  push:
    branches: [main]
    paths: ["toolkit/**", ".github/workflows/toolkit.yml"]
  pull_request:
    branches: [main]
    paths: ["toolkit/**", ".github/workflows/toolkit.yml"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      coord-dashboard: ${{ steps.filter.outputs['coord-dashboard'] }}
      handoffs: ${{ steps.filter.outputs.handoffs }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'toolkit/Cargo.toml'
              - 'toolkit/Cargo.lock'
              - 'toolkit/rust-toolchain.toml'
              - 'toolkit/rustfmt.toml'
              - 'toolkit/justfile'
              - 'toolkit/LICENSE.md'
              - '.github/workflows/toolkit.yml'
              - 'toolkit/.gitignore'
              - 'toolkit/commit/**'
              - 'toolkit/coord/**'
              - 'toolkit/handoff/**'
              - 'toolkit/notify/**'
              - 'toolkit/skillet/**'
            coord-dashboard:
              - 'toolkit/apps/coord-dashboard/**'
              - 'toolkit/coord/**'
              - 'toolkit/justfile'
              - 'toolkit/LICENSE.md'
              - '.github/workflows/toolkit.yml'
              - 'toolkit/.gitignore'
            handoffs:
              - 'toolkit/apps/handoffs/**'
              - 'toolkit/handoff/**'
              - 'toolkit/justfile'
              - 'toolkit/LICENSE.md'
              - '.github/workflows/toolkit.yml'
              - 'toolkit/.gitignore'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: toolkit
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: toolkit
      - uses: extractions/setup-just@v4
      - run: just rust-check

  coord-dashboard:
    needs: changes
    if: needs.changes.outputs['coord-dashboard'] == 'true'
    name: Coordination dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        working-directory: toolkit/apps/coord-dashboard
        run: bun install --frozen-lockfile
      - name: Run checks
        working-directory: toolkit/apps/coord-dashboard
        run: bun run check

  handoffs:
    needs: changes
    if: needs.changes.outputs.handoffs == 'true'
    name: Handoffs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        working-directory: toolkit/apps/handoffs
        run: bun install --frozen-lockfile
      - name: Run checks
        working-directory: toolkit/apps/handoffs
        run: bun run check
