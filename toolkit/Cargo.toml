[workspace]
members = ["commit", "coord", "notify", "skillet"]
resolver = "3"

[workspace.package]
authors = ["Paul Razvan Berg"]
edition = "2024"
homepage = "https://github.com/PaulRBerg/agent-toolkit"
license = "MIT"
repository = "https://github.com/PaulRBerg/agent-toolkit"
version = "1.0.0"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3.20"
thiserror = "2"
toml = "0.9"

[profile.release]
lto = "thin"
strip = true
