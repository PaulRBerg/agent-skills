[package]
authors = ["Paul Razvan Berg"]
description = "Prepare immutable Git snapshots and commit them safely in shared working trees"
edition = "2024"
homepage = "https://github.com/PaulRBerg/ai-commit"
license = "MIT"
name = "ai-commit"
repository = "https://github.com/PaulRBerg/ai-commit"
version = "0.1.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
toml = "0.9"
wait-timeout = "0.2"

[profile.release]
lto = "thin"
strip = true
