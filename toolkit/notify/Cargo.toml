[package]
authors = ["Paul Razvan Berg"]
description = "Desktop notification system for Claude Code and Codex CLI"
edition = "2024"
homepage = "https://github.com/PaulRBerg/ai-notify"
license = "MIT"
name = "ai-notify"
repository = "https://github.com/PaulRBerg/ai-notify"
version = "1.0.0"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tempfile = "3.20"
thiserror = "2.0"
toml_edit = { version = "0.25", features = ["serde"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["chrono", "env-filter"] }

[profile.release]
lto = "thin"
strip = true
