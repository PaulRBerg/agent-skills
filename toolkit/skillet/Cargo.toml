[package]
name = "ai-skillet"
version = "0.1.0"
edition = "2024"
description = "Inspect and maintain agent-skill catalogs"
license = "MIT"
repository = "https://github.com/PaulRBerg/ai-skillet"
readme = "README.md"
keywords = ["agents", "skills", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
