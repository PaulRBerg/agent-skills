name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: cargo fmt --all -- --check
      - run: cargo check --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --test cli_surface --test catalog --test map --test doctor --test conformance
      - run: bunx --bun prettier@3.9.6 --check .
