[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{ name = "Paul Razvan Berg" }]
dependencies = ["click>=8.1"]
description = "Local coordination for parallel AI coding agents"
license = { file = "LICENSE.md" }
name = "ai-coord"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[project.optional-dependencies]
dev = ["pyright>=1.1", "pytest>=8.0", "ruff>=0.8"]

[project.scripts]
ai-coord = "ai_coord.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_coord"]
