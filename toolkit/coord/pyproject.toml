[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{ name = "Paul Razvan Berg" }]
dependencies = [
    "click>=8.1",
    "psutil>=7.2.2",
]
description = "Local coordination for parallel AI coding agents"
license = { file = "LICENSE.md" }
name = "ai-coord"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.165.0",
    "pyright>=1.1",
    "pytest>=8.0",
    "ruff>=0.8",
    "types-psutil>=7.2.2",
]

[project.scripts]
ai-coord = "ai_coord.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_coord"]
